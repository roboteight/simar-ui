name: Pull request checks
on: pull_request

jobs:
  tests-included:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: library changes must include tests
        run: |
          changed=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          echo "$changed"
          if echo "$changed" | grep -qE '^(src|scss)/' && ! echo "$changed" | grep -qE '^tests/'; then
            echo "::error::Changes to src/ or scss/ need matching changes in tests/. See CONTRIBUTING.md."
            exit 1
          fi

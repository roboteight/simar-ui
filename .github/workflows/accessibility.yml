name: Accessibility
on: [push, pull_request]

jobs:
  a11y:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # dist/ is committed (the CDN serves it), so it must match the source.
      - name: dist is up to date
        run: git diff --exit-code -- dist docs/docs.css
      - name: axe, contrast and keyboard checks
        run: npm run test:a11y
        env:
          CHROME_PATH: /usr/bin/google-chrome-stable
